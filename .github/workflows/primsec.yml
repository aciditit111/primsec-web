name: PrimSec Web build

on:
  workflow_dispatch:
  push:
    branches: [primsec]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-x86_64-pc-windows-gnu

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Cross
        run: cargo install --locked --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff cross
        env:
          RUSTFLAGS: "-A semicolon-in-expressions-from-non-local-macros"
      - name: Install Wasm-Bindgen
        run: cargo binstall --no-confirm --force --locked wasm-bindgen-cli@0.2.128

      - name: Build server
        run: cross build --locked --release --target x86_64-pc-windows-gnu

      - name: Build web
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir -p out/package
          cp target/x86_64-pc-windows-gnu/release/web-server.exe out/package/PrimSecWeb.exe
          cp -r dist out/package/static
          echo "${GITHUB_SHA}" > out/package/primsec-web.txt
          mkdir -p gen
          cp web/api_bindings.ts gen/ 2>/dev/null || true
          cp -r web/uniffi gen/uniffi

      - uses: actions/upload-artifact@v7
        with:
          name: primsec-web-windows
          path: out/package

      - uses: actions/upload-artifact@v7
        with:
          name: primsec-web-gen
          path: gen
